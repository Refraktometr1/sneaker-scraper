name: Ollama PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  ollama-pr-review:
    name: Ollama PR Review
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on:
      - self-hosted
      - ollama
    timeout-minutes: 15

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Review pull request with Ollama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          OLLAMA_MODEL: gemma4:26b
        run: npx ts-node scripts/ollama-pr-review.ts
